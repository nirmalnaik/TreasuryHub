spring:
  application:
    name: customer-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  observations:
    annotations:
      enabled: true
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.namespace: treasuryhub
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    propagation:
      type: w3c
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: customer-service
    description: TreasuryHub customer domain service

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
