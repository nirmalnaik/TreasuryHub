server:
  port: ${CUSTOMER_SERVER_PORT:8081}

spring:
  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5433/customer_db}
    username: ${CUSTOMER_DB_USERNAME:treasury}
    password: ${CUSTOMER_DB_PASSWORD:treasury}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${CUSTOMER_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      show-details: always
