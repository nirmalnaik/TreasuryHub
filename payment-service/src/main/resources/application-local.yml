server:
  port: ${PAYMENT_SERVER_PORT:8083}

spring:
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5435/payment_db}
    username: ${PAYMENT_DB_USERNAME:treasury}
    password: ${PAYMENT_DB_PASSWORD:treasury}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${PAYMENT_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoint:
    health:
      show-details: always
  health:
    kafka:
      enabled: false
