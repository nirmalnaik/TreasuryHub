server:
  port: ${PAYMENT_SERVER_PORT:8083}

spring:
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5435/payment_db}
    username: ${PAYMENT_DB_USERNAME:treasury}
    password: ${PAYMENT_DB_PASSWORD:treasury}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${PAYMENT_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  health:
    kafka:
      enabled: false

logging:
  file:
    name: ${TREASURYHUB_LOG_FILE:logs/payment-service.json}
  structured:
    format:
      file: ecs
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB

treasuryhub:
  api-docs:
    ui-origin: ${API_DOCS_UI_ORIGIN:http://localhost:8091}
