server:
  port: ${ACCOUNT_SERVER_PORT:8082}

spring:
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://localhost:5434/account_db}
    username: ${ACCOUNT_DB_USERNAME:treasury}
    password: ${ACCOUNT_DB_PASSWORD:treasury}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${ACCOUNT_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  file:
    name: ${TREASURYHUB_LOG_FILE:logs/account-service.json}
  structured:
    format:
      file: ecs
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB

treasuryhub:
  api-docs:
    ui-origin: ${API_DOCS_UI_ORIGIN:http://localhost:8091}
