server:
  port: ${ACCOUNT_SERVER_PORT:8082}

spring:
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://localhost:5434/account_db}
    username: ${ACCOUNT_DB_USERNAME:treasury}
    password: ${ACCOUNT_DB_PASSWORD:treasury}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${ACCOUNT_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      show-details: always
